<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - Arif Fashion House</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     ADMIN LOGIN / SETUP
========================= -->

<div id="loginScreen" class="modal">

  <div class="modal-box" style="max-width:420px;margin:60px auto">

    <h2 id="loginTitle">🔐 Admin Login</h2>

    <p id="loginMessage" class="note">
      Admin Panel-এ প্রবেশ করতে Password দিন।
    </p>


    <!-- FIRST TIME / RESET PASSWORD -->

    <div id="setupArea" class="hidden">

      <label>
        নতুন Password

        <input
          id="newPassword"
          type="password"
          placeholder="কমপক্ষে 6 অক্ষর"
          autocomplete="new-password"
        >
      </label>


      <label>
        Password আবার লিখুন

        <input
          id="confirmPassword"
          type="password"
          placeholder="Password আবার লিখুন"
          autocomplete="new-password"
        >
      </label>


      <button
        class="primary"
        type="button"
        onclick="createAdminPassword()"
      >
        🔐 Password Setup
      </button>

    </div>


    <!-- NORMAL LOGIN -->

    <div id="loginArea">

      <label>
        Admin Password

        <input
          id="adminPassword"
          type="password"
          placeholder="Password লিখুন"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter') adminLogin()"
        >
      </label>


      <button
        class="primary"
        type="button"
        onclick="adminLogin()"
      >
        🔓 Login
      </button>


      <button
        type="button"
        onclick="resetAdminPasswordUI()"
        style="margin-top:10px"
      >
        🔄 Forgot / Reset Password
      </button>

    </div>

  </div>

</div>


<!-- =========================
     ADMIN APP
========================= -->

<div id="adminApp" class="hidden">


<header class="topbar">

  <div class="brand">

    <div class="brand-mark">
      AF
    </div>

    <div>
      <b>Admin Panel</b>
      <small>Arif Fashion House</small>
    </div>

  </div>


  <div style="display:flex;gap:8px;align-items:center">

    <a
      class="admin-link"
      href="index.html"
    >
      Store
    </a>


    <button
      type="button"
      onclick="adminLogout()"
    >
      Logout
    </button>

  </div>

</header>


<main>


<!-- =========================
     DASHBOARD
========================= -->

<section class="box">

  <h2>📊 Admin Dashboard</h2>


  <div
    style="
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(130px,1fr));
      gap:10px
    "
  >

    <div class="box">

      <b>📦 Products</b>

      <h2 id="productCount">
        0
      </h2>

    </div>


    <div class="box">

      <b>🛒 Orders</b>

      <h2 id="orderCount">
        0
      </h2>

    </div>


    <div class="box">

      <b>⏳ Pending</b>

      <h2 id="pendingCount">
        0
      </h2>

    </div>

  </div>

</section>


<!-- =========================
     WEBSITE SETTINGS
========================= -->

<section class="box">

  <h2>⚙️ Website Settings</h2>


  <input
    id="setBrand"
    placeholder="Brand name"
  >


  <input
    id="setHero"
    placeholder="Hero title"
  >


  <input
    id="setShipping"
    type="number"
    placeholder="Default delivery charge"
  >


  <textarea
    id="setWarning"
    placeholder="Confirm order warning"
  ></textarea>


  <label>

    <input
      type="checkbox"
      id="codOn"
    >

    Cash on Delivery enabled

  </label>


  <label>

    <input
      type="checkbox"
      id="advanceOn"
    >

    Advance Payment enabled

  </label>


  <button
    class="primary"
    type="button"
    onclick="saveSettings()"
  >
    Save Settings
  </button>

</section>


<!-- =========================
     ADD / EDIT PRODUCT
========================= -->

<section class="box">

  <h2>📦 Add / Edit Product</h2>


  <input
    type="hidden"
    id="pId"
  >


  <input
    id="pName"
    placeholder="Product name"
  >


  <select id="pCat">

    <option value="men">
      Men
    </option>

    <option value="women">
      Women
    </option>

    <option value="kids">
      Kids
    </option>

  </select>


  <input
    id="pImage"
    placeholder="Image URL (optional)"
  >


  <input
    id="pPrice"
    type="number"
    placeholder="Regular price"
  >


  <input
    id="pOld"
    type="number"
    placeholder="Old price (optional)"
  >


  <input
    id="pColors"
    placeholder="Colors: Black, Blue, Red"
  >


  <input
    id="pSizes"
    placeholder="Sizes: S, M, L, XL (blank if not applicable)"
  >


  <input
    id="pVideo"
    placeholder="YouTube/Facebook video link (optional)"
  >


  <textarea
    id="pDesc"
    placeholder="Product description"
  ></textarea>


  <button
    class="primary"
    type="button"
    onclick="saveProduct()"
  >
    Save Product
  </button>


  <button
    type="button"
    onclick="clearProduct()"
  >
    Clear
  </button>

</section>


<!-- =========================
     PRODUCTS
========================= -->

<section>

  <h2>🛍️ Products</h2>


  <div
    id="adminProducts"
    class="grid"
  ></div>

</section>


<!-- =========================
     ORDERS
========================= -->

<section>

  <h2>📋 Orders</h2>


  <div
    id="orders"
    class="order-grid"
  ></div>

</section>


<!-- =========================
     SECURITY
========================= -->

<section class="box">

  <h2>🔑 Security</h2>


  <p class="note">
    Admin Password পরিবর্তন করতে নিচের button ব্যবহার করুন।
  </p>


  <button
    type="button"
    onclick="changeAdminPassword()"
  >
    🔐 Change Admin Password
  </button>

</section>


</main>

</div>


<!-- =========================
     ADMIN JS
========================= -->

<script src="admin.js"></script>


<!-- =========================
     RESET UI FIX
========================= -->

<script>

function resetAdminPasswordUI() {

  const ok = confirm(
    "Admin Password reset করতে চান?\n\n" +
    "শুধু Admin Login Password reset হবে।\n" +
    "Product, Order এবং Settings data মুছবে না।"
  );


  if (!ok) {
    return;
  }


  /* শুধু password/session remove হবে */

  localStorage.removeItem(
    "afh_admin_password_hash"
  );

  localStorage.removeItem(
    "afh_admin_session"
  );


  /* Login screen দেখাও */

  const loginScreen =
    document.getElementById("loginScreen");

  const adminApp =
    document.getElementById("adminApp");

  const setupArea =
    document.getElementById("setupArea");

  const loginArea =
    document.getElementById("loginArea");

  const loginTitle =
    document.getElementById("loginTitle");

  const loginMessage =
    document.getElementById("loginMessage");


  if (adminApp) {
    adminApp.classList.add("hidden");
  }


  if (loginScreen) {
    loginScreen.classList.remove("hidden");
  }


  /* Create Password section দেখাও */

  if (setupArea) {
    setupArea.classList.remove("hidden");
  }


  if (loginArea) {
    loginArea.classList.add("hidden");
  }


  if (loginTitle) {
    loginTitle.textContent =
      "🔐 Create Admin Password";
  }


  if (loginMessage) {
    loginMessage.textContent =
      "নতুন Admin Password তৈরি করুন।";
  }


  /* পুরোনো input clear */

  const oldPassword =
    document.getElementById("adminPassword");

  if (oldPassword) {
    oldPassword.value = "";
  }


  const newPassword =
    document.getElementById("newPassword");

  if (newPassword) {
    newPassword.value = "";
    newPassword.focus();
  }


  const confirmPassword =
    document.getElementById("confirmPassword");

  if (confirmPassword) {
    confirmPassword.value = "";
  }

}

</script>


</body>
</html>
